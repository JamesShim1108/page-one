<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Temporary Terms layout check</title>
    <style>
      body {
        margin: 0;
        font: 15px system-ui;
        background: #eee;
      }
      header {
        display: flex;
        gap: 20px;
        padding: 12px;
        align-items: center;
      }
      select {
        padding: 8px;
      }
      iframe {
        display: block;
        width: 390px;
        height: 844px;
        border: 1px solid #aaa;
        margin: 0 auto;
        background: white;
      }
    </style>
  </head>
  <body>
    <header>
      <label
        >Viewport width
        <select id="width">
          <option>320</option>
          <option>360</option>
          <option selected>390</option>
          <option>600</option>
          <option>768</option>
          <option>1024</option>
        </select></label
      >
      <label
        >Study view
        <select id="route">
          <option value="/unit/world-1">Unit 1 Hub</option>
          <option value="/terms/world-1">Terms picker</option>
          <option value="/term-set/world-period-1-a?unit=world-1">
            List A flashcards
          </option>
          <option value="/term-set/world-period-1-b?unit=world-1">
            List B flashcards
          </option>
          <option value="/term-set/world-period-1-a?unit=world-1&view=list">
            List A term list
          </option>
          <option value="/unit/world-2">Unit 2 Hub</option>
          <option value="/unit/world-3">Empty unit hub</option>
        </select></label
      >
      <span>Temporary responsive verification only.</span>
    </header>
    <iframe
      id="preview"
      title="Page One responsive preview"
      src="./index.html?layout-check=6bcaa93#/unit/world-1"
    ></iframe>
    <script>
      const preview = document.getElementById("preview");
      document.getElementById("width").addEventListener("change", (event) => {
        preview.style.width = `${event.target.value}px`;
      });
      document.getElementById("route").addEventListener("change", (event) => {
        preview.src = `./index.html?layout-check=6bcaa93#${event.target.value}`;
      });
    </script>
  </body>
</html>
